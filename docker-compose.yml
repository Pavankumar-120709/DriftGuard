version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: driftguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: driftguard
      POSTGRES_PASSWORD: driftguard_secure_password
      POSTGRES_DB: driftguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftguard -d driftguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: driftguard-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000

  # 3. DriftGuard FastAPI Backend Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: driftguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DriftGuard
      - APP_ENV=production
      - DATABASE_URL=postgresql://driftguard:driftguard_secure_password@postgres:5432/driftguard_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=customer-churn-production
      - DRIFT_SHARE_THRESHOLD=0.30
      - P_VALUE_THRESHOLD=0.05
      - RETRAINING_DRIFT_THRESHOLD=0.35
      - RETRAINING_PERFORMANCE_DROP_THRESHOLD=0.05
      - AUTO_RETRAIN_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./models_store:/app/models_store
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  # 4. DriftGuard Next.js Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: driftguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  mlflow_data:
